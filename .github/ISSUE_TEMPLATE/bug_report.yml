name: 缺陷报告（Bug）
description: 报告一个功能缺陷或与描述不符的行为
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 描述实际行为，贴上报错原文（如有）。
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 你期望发生什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从打开页面到看到问题，一步步写。涉及资料时用脱敏样例，不要贴真实病历。
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统 + 浏览器（含版本）+ Node 版本（如适用）。
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: 使用通道
      options:
        - 本机链路（node dev/local-app/server.mjs）
        - 构建产物（npm run build 后自行托管）
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我确认没有在报告中包含真实患者资料
          required: true
        - label: 我已阅读 SECURITY.md，且这不是一个隐私/安全问题（隐私问题请私密报告）
          required: true
